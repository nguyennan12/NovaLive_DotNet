services:
  postgres:
    image: postgres:17-alpine
    container_name: novalive_postgres_dev
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-novalive_db}"
      POSTGRES_USER: "${POSTGRES_USER:-nova_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nova_password}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova_user} -d ${POSTGRES_DB:-novalive_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: novalive_redis_dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: novalive_rabbitmq_dev
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RabbitMQ__Username:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RabbitMQ__Password:-guest}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: novalive_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minio_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio_password}"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  novalive-api:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: novalive_api_dev
    ports:
      - "5001:8080"
    # Relative to this compose file; load the root .env using ASP.NET Core __ keys.
    env_file:
      - ../../.env
    environment:
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      Cookies__AccessTokenName: "${Cookies__AccessTokenName:-nova_at}"
      Cookies__RefreshTokenName: "${Cookies__RefreshTokenName:-nova_rt}"
      Cookies__SameSite: "${Cookies__SameSite:-Lax}"
      Cookies__Secure: "${Cookies__Secure:-false}"
      Cookies__Domain: "${Cookies__Domain:-}"
      Cors__AllowedOrigins__0: "${Cors__AllowedOrigins__0:-http://localhost:3000}"
      Cors__AllowedOrigins__1: "${Cors__AllowedOrigins__1:-http://localhost:5173}"
      Cors__AllowedOrigins__2: "${Cors__AllowedOrigins__2:-http://localhost:8080}"
    labels:
      project: "novalive-ecommerce"
    volumes:
      # Mount entire repo into container for hot-reload
      - ../..:/app
      # Cache nuget packages to avoid redownloading
      - nuget-data:/root/.nuget/packages
      # Anonymous volumes to prevent bin/obj Windows-Linux locks and conflicts
      - /app/src/NovaLive.Api/bin
      - /app/src/NovaLive.Api/obj
      - /app/src/NovaLive.Application/bin
      - /app/src/NovaLive.Application/obj
      - /app/src/NovaLive.Domain/bin
      - /app/src/NovaLive.Domain/obj
      - /app/src/NovaLive.Infrastructure/bin
      - /app/src/NovaLive.Infrastructure/obj
      - /app/src/NovaLive.Contracts/bin
      - /app/src/NovaLive.Contracts/obj
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  nuget-data:
