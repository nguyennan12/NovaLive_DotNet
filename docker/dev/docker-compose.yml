services:
  postgres:
    image: postgres:17-alpine
    container_name: novalive_postgres_dev
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: novalive_redis_dev
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: novalive_rabbitmq_dev
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: novalive_minio_dev
    command: server /data --console-address ":9001"
    env_file:
      - ../../.env
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data

  novalive-api:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: novalive_api_dev
    ports:
      - "5001:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/health" ]
      interval: 5s
      timeout: 6s
      start_period: 120s
      retries: 12
    env_file:
      - ../../.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: "redis:6379,abortConnect=false"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_DEFAULT_USER}"
      RabbitMQ__Password: "${RABBITMQ_DEFAULT_PASS}"
      Jwt__Secret: "${JWT_SECRET}"
      Otp__Pepper: "${OTP_PEPPER}"
      Email__ApiKey: "${EMAIL_API_KEY}"
      Email__FromAddress: "${EMAIL_FROM_ADDRESS}"
      Ghn__ApiToken: "${GHN_API_TOKEN}"
      Ghn__ShopId: "${GHN_SHOP_ID}"
      Ghn__WebhookSecret: "${GHN_WEBHOOK_SECRET}"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "${MINIO_ROOT_USER}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Minio__UseSsl: "false"
      Minio__CdnBaseUrl: "https://cdn.novalive.vn"
      Momo__PartnerCode: "${MOMO_PARTNER_CODE:-MOMO}"
      Momo__AccessKey: "${MOMO_ACCESS_KEY:-}"
      Momo__SecretKey: "${MOMO_SECRET_KEY:-}"
      VietQr__WebhookSecret: "${VIETQR_WEBHOOK_SECRET:-}"
      VietQr__AccountNumber: "${VIETQR_ACCOUNT_NUMBER:-0000123456789}"
      VietQr__BankBin: "${VIETQR_BANK_BIN:-970422}"
      VietQr__AccountName: "${VIETQR_ACCOUNT_NAME:-CONG TY NOVALIVE}"
      VietQr__ClientId: "${VIETQR_USERNAME:-${VIETQR_CLIENT_ID:-}}"
      VietQr__ApiKey: "${VIETQR_PASSWORD:-${VIETQR_API_KEY:-}}"
      VietQr__BaseUrl: "${VIETQR_API_BASE_URL:-${VIETQR_BASE_URL:-https://api.vietqr.vn}}"
    labels:
      project: "novalive-ecommerce"
    volumes:
      - ../..:/app
      - nuget-data:/root/.nuget/packages
      - /app/src/NovaLive.Api/bin
      - /app/src/NovaLive.Api/obj
      - /app/src/NovaLive.Application/bin
      - /app/src/NovaLive.Application/obj
      - /app/src/NovaLive.Domain/bin
      - /app/src/NovaLive.Domain/obj
      - /app/src/NovaLive.Infrastructure/bin
      - /app/src/NovaLive.Infrastructure/obj
      - /app/src/NovaLive.Contracts/bin
      - /app/src/NovaLive.Contracts/obj
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  nuget-data:
