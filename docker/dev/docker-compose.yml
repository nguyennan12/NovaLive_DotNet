services:
  postgres:
    image: postgres:17-alpine
    container_name: novalive_postgres_dev
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-novalive_db}"
      POSTGRES_USER: "${POSTGRES_USER:-nova_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nova_password}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova_user} -d ${POSTGRES_DB:-novalive_db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: novalive_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: novalive_rabbitmq_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-guest}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: novalive_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minio_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio_password}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  novalive-api:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: novalive_api_dev
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-novalive_db};Username=${POSTGRES_USER:-nova_user};Password=${POSTGRES_PASSWORD:-nova_password}"
      Redis__ConnectionString: "redis:6379"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__Username: "${RABBITMQ_USER:-guest}"
      RabbitMQ__Password: "${RABBITMQ_PASS:-guest}"
      Jwt__Secret: "${JWT_SECRET:-NovaLive_Super_Secret_Jwt_Key_For_Development_Environment_2026_KeyMustBeLongEnough!}"
      Jwt__Issuer: "NovaLive"
      Jwt__Audience: "NovaLiveClients"
    labels:
      project: "novalive-ecommerce"
    volumes:
      # Mount entire repo into container for hot-reload
      - ../..:/app
      # Cache nuget packages to avoid redownloading
      - nuget-data:/root/.nuget/packages
      # Anonymous volumes to prevent bin/obj Windows-Linux locks and conflicts
      - /app/src/NovaLive.Api/bin
      - /app/src/NovaLive.Api/obj
      - /app/src/NovaLive.Application/bin
      - /app/src/NovaLive.Application/obj
      - /app/src/NovaLive.Domain/bin
      - /app/src/NovaLive.Domain/obj
      - /app/src/NovaLive.Infrastructure/bin
      - /app/src/NovaLive.Infrastructure/obj
      - /app/src/NovaLive.Contracts/bin
      - /app/src/NovaLive.Contracts/obj
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  nuget-data:
